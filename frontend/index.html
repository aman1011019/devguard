<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="DevGuard — AI Production Incident Investigator. Finds why software broke, explains it, fixes it and verifies the fix." />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>DevGuard — AI Incident Investigator</title>
    <link rel="icon" type="image/png" href="/logo.png" />

      (function () {
        try {
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add("light");
          localStorage.setItem("devguard.theme", "light");
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
